name: Setup Swift
description: >
  Install the Swift toolchain across Linux (including ubuntu-24.04-arm), macOS,
  and Windows. Wraps SwiftyLab/setup-swift, which supports aarch64 Linux
  runners (where swift-actions/setup-swift@v2 currently returns a corrupted
  binary). No-ops if `swift` is already on PATH.

inputs:
  swift-version:
    description: "Swift version to install (e.g. '6.0')"
    required: false
    default: "6.0"

runs:
  using: composite
  steps:
    - name: Check existing Swift
      id: existing
      shell: bash
      run: |
        if command -v swift >/dev/null 2>&1; then
          echo "Swift already installed: $(swift --version | head -n1)"
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    # Pinned to the commit SHA behind v1.14.0, not @latest: `latest` is a separate,
    # explicitly moving tag ref in this repo (resolves to a different SHA than v1.14.0),
    # so it gave zero protection against an upstream compromise or accidental bad push.
    # Audited 2026-08-30: `v1.14.0` is a signed, annotated tag
    # (`gh api repos/SwiftyLab/setup-swift/git/refs/tags/v1.14.0` -> tag object
    # 76e3e48ac9c85b393a30adefd96afe0395b23c29, GitHub-verified PGP signature) pointing at
    # commit 38f54a76b70d989321de9dc7c840618c08cf56e9, which is what is pinned below. Bump
    # this SHA (and re-audit) when picking up a newer setup-swift release. ~keep
    - name: Install Swift via SwiftyLab/setup-swift
      if: steps.existing.outputs.installed != 'true'
      uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
      with:
        swift-version: ${{ inputs.swift-version }}
