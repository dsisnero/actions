version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install pre-commit hooks and dev environment
    cmds:
      - uv lock --check || uv lock
      - uv sync --group dev
      - command -v poly >/dev/null 2>&1 || brew install goldziher/tap/poly
      - poly hooks install

  update:
    desc: Update pre-commit hooks and dependencies
    cmds:
      - uv sync --group dev --upgrade
      - gh-actions-updater --update .

  lint:
    desc: Run all linters and formatting checks via poly
    cmds:
      - poly lint .
      - poly fmt --check .

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:bats
      - task: test:pester

  test:unit:
    desc: Run pytest unit tests
    cmds:
      - uv run pytest -v

  test:bats:
    desc: Run Bats tests for Bash action scripts
    cmds:
      - bats --recursive --print-output-on-failure .

  test:pester:
    desc: Run Pester tests for PowerShell action scripts
    cmds:
      # Single-quoted so the shell cannot expand `$c`/`$true` before pwsh sees them.
      # Run.Throw fails the run when discovery finds no tests, so a broken glob cannot pass
      # as a green suite. Windows-only assertions are `-Skip`ped off Windows.
      - >-
        pwsh -NoProfile -Command
        'Import-Module Pester -MinimumVersion 5.5.0 -Force;
        $c = New-PesterConfiguration;
        $c.Run.Path = ".";
        $c.Run.Exit = $true;
        $c.Run.Throw = $true;
        $c.Output.Verbosity = "Detailed";
        Invoke-Pester -Configuration $c'

  test:act:
    desc: Run a specific test workflow locally (usage{{":"}} task test:act -- test-setup-rust.yml)
    cmds:
      - act -W .github/workflows/{{.CLI_ARGS}}

  validate:
    desc: Run lint (poly handles actionlint + shellcheck + shfmt)
    cmds:
      - task: lint
