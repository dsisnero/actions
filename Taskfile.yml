version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install pre-commit hooks and dev environment
    cmds:
      - uv lock --check || uv lock
      - uv sync --group dev
      - command -v poly >/dev/null 2>&1 || brew install goldziher/tap/poly
      - poly hooks install

  update:
    desc: Update pre-commit hooks and dependencies
    cmds:
      - uv sync --group dev --upgrade
      - gh-actions-updater --update .

  lint:
    desc: Run all linters and formatting checks via poly
    cmds:
      - poly lint .
      - poly fmt --check .
      - task: lint:bats

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:bats
      - task: test:pester

  test:unit:
    desc: Run pytest unit tests
    cmds:
      - uv run pytest -v

  test:bats:
    desc: Run Bats tests for Bash action scripts
    env:
      # Suites resolve the shared helpers with `bats_load_library xberg-bats`, which searches
      # BATS_LIB_PATH and nothing else. CI passes the same directory to run-bats via lib-path.
      BATS_LIB_PATH: "{{.ROOT_DIR}}/bats-lib"
    cmds:
      - bats --recursive --print-output-on-failure .

  test:pester:
    desc: Run Pester tests for PowerShell action scripts
    cmds:
      # Single-quoted so the shell cannot expand `$c`/`$true` before pwsh sees them.
      # Run.Throw fails the run when discovery finds no tests, so a broken glob cannot pass
      # as a green suite. Windows-only assertions are `-Skip`ped off Windows.
      - >-
        pwsh -NoProfile -Command
        'Import-Module Pester -MinimumVersion 5.5.0 -Force;
        $c = New-PesterConfiguration;
        $c.Run.Path = ".";
        $c.Run.Exit = $true;
        $c.Run.Throw = $true;
        $c.Output.Verbosity = "Detailed";
        Invoke-Pester -Configuration $c'

  lint:bats:
    desc: Format-check and lint Bats suites
    cmds:
      # poly has no engine for the .bats extension, so these files are invisible to `poly lint`.
      # shfmt 3.14 has a bats dialect and shellcheck parses `@test "x" { }` as bash, so both
      # tools work here -- they just have to be invoked directly.
      #
      # Four codes are disabled, all of them structural to how Bats suites are written:
      #   SC2016/SC2183  a stub body is single-quoted on purpose -- the expansion and the format
      #                  string belong to the STUB, which runs later, not to the line writing it.
      #   SC2030/SC2031  `run` forks, so shellcheck sees every export in setup() as "modified in
      #                  a subshell". That fork is real and load-bearing (it is why a suite must
      #                  call an exporting function directly rather than through `run`), but the
      #                  warning fires on correct code 62 times and cannot distinguish the two.
      # Everything else stays on. ~keep
      - 'shfmt -ln bats -d $(git ls-files "*.bats")'
      - 'shellcheck -s bash -e SC2016,SC2183,SC2030,SC2031 $(git ls-files "*.bats")'

  test:act:
    desc: Run a specific test workflow locally (usage{{":"}} task test:act -- test-setup-rust.yml)
    cmds:
      - act -W .github/workflows/{{.CLI_ARGS}}

  validate:
    desc: Run lint (poly handles actionlint + shellcheck + shfmt)
    cmds:
      - task: lint
