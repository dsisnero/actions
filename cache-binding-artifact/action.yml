name: Cache Binding Artifact
description: Generic cache management for compiled binding artifacts (restore or save)
inputs:
  binding-name:
    description: "Language binding name (e.g., python, ruby, go, java, csharp, php, node, wasm, ffi)"
    required: true
  cache-key:
    description: "Full cache key for this artifact"
    required: true
  cache-restore-keys:
    description: "Fallback restore keys (one per line)"
    required: false
    default: ""
  cache-paths:
    description: "Paths to cache (one per line)"
    required: true
  operation:
    description: "Operation to perform: restore or save"
    required: true
  enable-crossplatform-cache:
    description: "Enable cross-OS caching"
    required: false
    default: "false"
outputs:
  cache-hit:
    description: "Whether the cache was restored (exact match)"
    value: ${{ steps.cache-restore.outputs.cache-hit }}
  cache-matched-key:
    description: "The cache key that was matched"
    value: ${{ steps.cache-restore.outputs.cache-matched-key || steps.cache-save.outputs.cache-key }}
  cache-primary-key:
    description: "The primary cache key used"
    value: ${{ inputs.cache-key }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CACHE_OPERATION: ${{ inputs.operation }}
        CACHE_BINDING_NAME: ${{ inputs.binding-name }}
      run: |
        if [[ "$CACHE_OPERATION" != "restore" && "$CACHE_OPERATION" != "save" ]]; then
          echo "Error: operation must be 'restore' or 'save'"
          exit 1
        fi
        echo "Binding: $CACHE_BINDING_NAME, Operation: $CACHE_OPERATION"

    - name: Restore cache
      id: cache-restore
      if: inputs.operation == 'restore'
      uses: actions/cache/restore@v6
      with:
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.cache-restore-keys }}
        path: ${{ inputs.cache-paths }}
        enableCrossOsArchive: ${{ inputs.enable-crossplatform-cache }}
        fail-on-cache-miss: false
        lookup-only: false

    - name: Report cache restore result
      if: inputs.operation == 'restore'
      shell: bash
      env:
        CACHE_BINDING_NAME: ${{ inputs.binding-name }}
        CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
        CACHE_MATCHED_KEY: ${{ steps.cache-restore.outputs.cache-matched-key }}
      run: |
        if [[ "$CACHE_HIT" == "true" ]]; then
          echo "Cache HIT (exact match) for $CACHE_BINDING_NAME"
        elif [[ -n "$CACHE_MATCHED_KEY" ]]; then
          echo "Cache PARTIAL HIT for $CACHE_BINDING_NAME"
          echo "  Matched key: $CACHE_MATCHED_KEY"
        else
          echo "Cache MISS for $CACHE_BINDING_NAME"
        fi

    - name: Save cache
      id: cache-save
      if: inputs.operation == 'save'
      uses: actions/cache/save@v6
      with:
        key: ${{ inputs.cache-key }}
        path: ${{ inputs.cache-paths }}
        enableCrossOsArchive: ${{ inputs.enable-crossplatform-cache }}

    - name: Report cache save result
      if: inputs.operation == 'save'
      shell: bash
      env:
        CACHE_BINDING_NAME: ${{ inputs.binding-name }}
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        echo "Saved $CACHE_BINDING_NAME to cache: $CACHE_KEY"
