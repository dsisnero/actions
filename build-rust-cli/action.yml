name: Build Rust CLI Binary
description: Builds a standalone Rust CLI binary

inputs:
  package-name:
    description: Cargo package name to build
    required: true
  binary-name:
    description: Name of the output binary (without extension)
    required: true
  target:
    description: Rust target triple (optional, for cross-compilation)
    required: false
    default: ""
  extra-cargo-args:
    description: Additional arguments to pass to cargo build
    required: false
    default: ""
  glibc-version:
    description: 'glibc floor for gnu targets via cargo-zigbuild (e.g. "2.28"). Empty (default) = plain cargo build; opt-in only (caller must install zig + cargo-zigbuild).'
    required: false
    default: ""

outputs:
  binary-path:
    description: Path to the built CLI binary
    value: ${{ steps.build.outputs.binary-path }}

runs:
  using: composite
  steps:
    - name: Build CLI binary
      id: build
      shell: bash
      env:
        RUST_PACKAGE_NAME: ${{ inputs.package-name }}
        RUST_BINARY_NAME: ${{ inputs.binary-name }}
        RUST_TARGET: ${{ inputs.target }}
        RUST_GLIBC_VERSION: ${{ inputs.glibc-version }}
        RUST_EXTRA_CARGO_ARGS: ${{ inputs.extra-cargo-args }}
      run: |
        set -euo pipefail
        TARGET_DIR="target/release"
        declare -a CARGO_CMD=(cargo build)
        declare -a TARGET_FLAG=()
        if [[ -n "$RUST_TARGET" ]]; then
          # Use zigbuild for linux-gnu targets with glibc floor lowering
          if [[ "$RUST_TARGET" == *"-linux-gnu" ]] && [[ -n "$RUST_GLIBC_VERSION" ]]; then
            CARGO_CMD=(cargo zigbuild)
            GLIBC_SUFFIXED_TARGET="${RUST_TARGET}.${RUST_GLIBC_VERSION}"
            TARGET_FLAG=(--target "$GLIBC_SUFFIXED_TARGET")
            # Artifacts are emitted to target/<base-triple>/release, not target/<base-triple>.glibc/release
            TARGET_DIR="target/${RUST_TARGET}/release"
            echo "[build-rust-cli] glibc floor: ${RUST_GLIBC_VERSION} (target: ${GLIBC_SUFFIXED_TARGET})"
          else
            TARGET_FLAG=(--target "$RUST_TARGET")
            TARGET_DIR="target/${RUST_TARGET}/release"
          fi
        fi

        # extra-cargo-args is documented as "additional arguments" (plural): a
        # space-separated (or multi-line) list of flags, e.g. "--features foo bar" or
        # "--features foo\n--no-default-features", not a single opaque token, so
        # blanket-quoting it as one word would change its contract.
        #
        # `read -ra <<< "$VAR"` was tried first and rejected: it only performs IFS
        # word-splitting on the first line, silently dropping every subsequent line, and
        # it does not honor quotes, so `--features "foo bar"` splits into the two
        # tokens `"foo` and `bar"` (literal quote characters) instead of one `foo bar`
        # token. Silent data loss on legitimate multi-line/quoted input is worse than
        # the injection it was meant to fix.
        #
        # xargs -n1 does honor shell-style quoting and processes every line, so it is
        # used to split the value into one argv entry per line instead: it never
        # re-executes the value (no `eval`, no re-parsing for `;`, `$()`, backticks,
        # `|`, `&&` as shell syntax — those become literal characters inside a token),
        # so a hostile value becomes at worst extra literal argv tokens handed to cargo,
        # never a second command.
        #
        # Two deliberate, tested trade-offs:
        # - An unbalanced quote makes xargs exit non-zero ("unterminated quote"); that
        #   is caught explicitly below and fails the step loudly rather than silently
        #   truncating the value, which is the right failure mode for malformed input.
        # - xargs also treats a backslash as a quoting escape, so a legitimate value
        #   containing a literal backslash (e.g. `foo\bar`) is collapsed to `foobar`.
        #   Cargo flags/feature names do not need literal backslashes in practice; a
        #   caller who does needs a different mechanism, not this input. ~keep
        declare -a EXTRA_ARGS=()
        if [[ -n "$RUST_EXTRA_CARGO_ARGS" ]]; then
          extra_cargo_args_split="$(printf '%s' "$RUST_EXTRA_CARGO_ARGS" | xargs -n1 printf '%s\n')" || {
            echo "::error::extra-cargo-args could not be parsed as shell-style arguments (unbalanced quote?)" >&2
            exit 1
          }
          while IFS= read -r extra_cargo_arg; do
            EXTRA_ARGS+=("$extra_cargo_arg")
          done <<< "$extra_cargo_args_split"
        fi

        "${CARGO_CMD[@]}" --locked --release --package "$RUST_PACKAGE_NAME" "${TARGET_FLAG[@]}" "${EXTRA_ARGS[@]}"

        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "binary-path=$GITHUB_WORKSPACE/${TARGET_DIR}/${RUST_BINARY_NAME}.exe" >> "$GITHUB_OUTPUT"
        else
          echo "binary-path=$GITHUB_WORKSPACE/${TARGET_DIR}/${RUST_BINARY_NAME}" >> "$GITHUB_OUTPUT"
        fi
