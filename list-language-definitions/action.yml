name: List Language Definitions
description: >
  Read a language-definitions JSON registry (top-level object keyed by
  language name) and emit the sorted, comma-joined list of language names as
  a step output. Used to populate TSLP_LANGUAGES for an "all languages" build.

inputs:
  definitions-path:
    description: "Path to the language-definitions JSON file"
    required: false
    default: "sources/language_definitions.json"

outputs:
  names:
    description: "Sorted, comma-joined language names"
    value: ${{ steps.list.outputs.names }}

runs:
  using: composite
  steps:
    - name: Get all language names
      id: list
      shell: bash
      env:
        DEFINITIONS_PATH: ${{ inputs.definitions-path }}
      run: |
        # DEFINITIONS_PATH is passed as sys.argv[1], never interpolated into the Python
        # source string itself, so its value cannot break out of both the bash "..."
        # quoting and the Python string literal at once (the double-breakout surface
        # this action previously had).
        LANGS=$(python3 -c "
        import json, sys
        with open(sys.argv[1]) as f:
            d = json.load(f)
        print(','.join(sorted(d.keys())))
        " "$DEFINITIONS_PATH")
        echo "names=$LANGS" >> "$GITHUB_OUTPUT"
